databases:
  - name: controle-estoque-db
    databaseName: controle_estoque
    user: controle_user
    plan: free

services:
  - type: web
    name: controle-estoque
    env: docker               # <- sintaxe oficial do Blueprint
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true

    envVars:
      # Laravel / URL (preenche com a URL pública do serviço)
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        fromService:
          name: controle-estoque
          type: web
          property: url
      - key: ASSET_URL
        fromService:
          name: controle-estoque
          type: web
          property: url

      # Sinalização: estamos em Render (opcional)
      - key: RENDER
        value: "true"

      # Banco de dados (Render injeta as credenciais)
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: controle-estoque-db
          property: connectionString
      - key: DB_HOST
        fromDatabase:
          name: controle-estoque-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: controle-estoque-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: controle-estoque-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: controle-estoque-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: controle-estoque-db
          property: password
